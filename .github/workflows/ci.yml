name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repository toolchain
        run: rustup show active-toolchain
      - name: Rust contracts, formatting, strict lint, and tests
        run: make ci
