[workspace]
members = [
    "xtask",
    "crates/<TARGET_CRATE>",
]
resolver = "3"

[workspace.package]
edition = "2024"
# Only declare a real MSRV/support contract.
# rust-version = "<REAL_MSRV>"

[workspace.dependencies]
# Only dependencies genuinely shared by multiple crates belong here.

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
